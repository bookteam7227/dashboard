<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교재팀 대시보드</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/css/components.css">
    <link rel="stylesheet" href="./assets/css/charts.css">
</head>

<body>
    <section id="loadingView" class="loading-view">
        로그인 상태를 확인하고 있습니다.
    </section>

    <section id="loginView" class="auth-gate" hidden>
        <div class="auth-card">
            <img
                class="auth-ci-logo"
                src="./assets/images/megastudy-logo.jpg"
                alt="megastudy"
            >

            <h1 class="auth-title">교재팀 대시보드 로그인</h1>

            <p class="auth-desc">
                승인된 계정만 대시보드에 접근할 수 있습니다.
            </p>

            <form id="loginForm" class="auth-fields">
                <input
                    id="email"
                    type="email"
                    placeholder="이메일"
                    autocomplete="username"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="비밀번호"
                    autocomplete="current-password"
                    required
                >

                <button id="loginButton" class="auth-login-btn" type="submit">
                    로그인
                </button>
            </form>

            <div id="loginMessage" class="auth-status">
                Firebase Authentication 계정으로 로그인해 주세요.
            </div>

            <div class="auth-note">
                등록된 계정으로 로그인한 사용자만 자료를 조회할 수 있습니다.
            </div>
        </div>
    </section>

    <section id="dashboardView" hidden>
        <div class="app-shell">
            <aside class="sidebar">
                <a class="brand" href="#/dashboard" aria-label="Dashboard">
                    <img
                        class="brand-ci-logo"
                        src="./assets/images/megastudy-logo.jpg"
                        alt="megastudy"
                    >
                </a>

                <nav class="menu" aria-label="대시보드 메뉴">
                    <a class="menu-link" data-route="dashboard" href="#/dashboard">
                        <span class="menu-icon" aria-hidden="true">⌂</span>
                        <span>Dashboard</span>
                    </a>

                    <a
                        class="menu-link"
                        data-route="shipping-statistics"
                        href="#/shipping-statistics"
                    >
                        <span class="menu-icon" aria-hidden="true">▥</span>
                        <span>발송 통계</span>
                    </a>
                </nav>
            </aside>

            <main class="main-area">
                <header class="topbar">
                    <div>
                        <h1 id="pageTitle" class="page-title">Dashboard</h1>
                    </div>

                    <div class="topbar-right">
                        <div id="pageActions" class="page-actions"></div>

                        <div class="session-chip">
                            <span class="session-role">일반</span>
                            <span id="sessionEmail" class="session-email">-</span>
                            <button id="logoutButton" class="session-logout" type="button">
                                로그아웃
                            </button>
                        </div>
                    </div>
                </header>

                <div id="pageContent" class="page-content"></div>
            </main>
        </div>
    </section>

    <script type="module" src="./js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교재팀 대시보드</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/css/components.css">
    <link rel="stylesheet" href="./assets/css/charts.css">
</head>

<body>
    <section id="loadingView" class="loading-view">
        로그인 상태를 확인하고 있습니다.
    </section>

    <section id="loginView" class="auth-gate" hidden>
        <div class="auth-card">
            <img
                class="auth-ci-logo"
                src="./assets/images/megastudy-logo.jpg"
                alt="megastudy"
            >

            <h1 class="auth-title">
                교재팀 대시보드 로그인
            </h1>

            <p class="auth-desc">
                승인된 계정만 대시보드에 접근할 수 있습니다.
            </p>

            <form id="loginForm" class="auth-fields">
                <input
                    id="email"
                    type="email"
                    placeholder="이메일"
                    autocomplete="username"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="비밀번호"
                    autocomplete="current-password"
                    required
                >

                <button
                    id="loginButton"
                    class="auth-login-btn"
                    type="submit"
                >
                    로그인
                </button>
            </form>

            <div id="loginMessage" class="auth-status">
                Firebase Authentication 계정으로 로그인해 주세요.
            </div>

            <div class="auth-note">
                등록된 계정으로 로그인한 사용자만 자료를 조회할 수 있습니다.
            </div>
        </div>
    </section>

    <section id="dashboardView" hidden>
        <div class="app-shell">
            <aside class="sidebar">
                <a
                    class="brand"
                    href="#/dashboard"
                    aria-label="Dashboard"
                >
                    <img
                        class="brand-ci-logo"
                        src="./assets/images/megastudy-logo.jpg"
                        alt="megastudy"
                    >
                </a>

                <nav
                    class="menu"
                    aria-label="대시보드 메뉴"
                >
                    <a
                        class="menu-link"
                        data-route="dashboard"
                        href="#/dashboard"
                    >
                        <svg
                            class="menu-icon"
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <rect
                                x="3"
                                y="3"
                                width="7"
                                height="9"
                                rx="1"
                            ></rect>

                            <rect
                                x="14"
                                y="3"
                                width="7"
                                height="5"
                                rx="1"
                            ></rect>

                            <rect
                                x="14"
                                y="12"
                                width="7"
                                height="9"
                                rx="1"
                            ></rect>

                            <rect
                                x="3"
                                y="16"
                                width="7"
                                height="5"
                                rx="1"
                            ></rect>
                        </svg>

                        <span>Dashboard</span>
                    </a>

                    <a
                        class="menu-link"
                        data-route="shipping-statistics"
                        href="#/shipping-statistics"
                        hidden
                    >
                        <svg
                            class="menu-icon"
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path
                                d="M3 3v18h18"
                            ></path>

                            <path
                                d="M7 15l4-4 3 2 5-6"
                            ></path>

                            <path
                                d="M19 7h-4"
                            ></path>

                            <path
                                d="M19 7v4"
                            ></path>
                        </svg>

                        <span>발송 통계</span>
                    </a>

                    <a
                        class="menu-link"
                        data-route="inventory-risk"
                        href="#/inventory-risk"
                        hidden
                    >
                        <svg
                            class="menu-icon"
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path
                                d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"
                            ></path>

                            <path
                                d="m3.3 7 8.7 5 8.7-5"
                            ></path>

                            <path
                                d="M12 22V12"
                            ></path>
                        </svg>

                        <span>교재 재고 현황</span>
                    </a>

                    <a
                        class="menu-link"
                        data-route="instructor-sales"
                        href="#/instructor-sales"
                        hidden
                    >
                        <svg
                            class="menu-icon"
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path
                                d="M3 20h18"
                            ></path>

                            <path
                                d="M6 16v-4"
                            ></path>

                            <path
                                d="M10 16V8"
                            ></path>

                            <path
                                d="M14 16v-6"
                            ></path>

                            <path
                                d="M18 16V4"
                            ></path>
                        </svg>

                        <span>강사별 매출 통계</span>
                    </a>

                    <a
                        class="menu-link"
                        data-route="monthly-statistics"
                        href="#/monthly-statistics"
                        hidden
                    >
                        <svg
                            class="menu-icon"
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <rect
                                x="3"
                                y="4"
                                width="18"
                                height="18"
                                rx="2"
                            ></rect>

                            <path
                                d="M16 2v4"
                            ></path>

                            <path
                                d="M8 2v4"
                            ></path>

                            <path
                                d="M3 10h18"
                            ></path>

                            <path
                                d="M8 14h2"
                            ></path>

                            <path
                                d="M14 14h2"
                            ></path>

                            <path
                                d="M8 18h2"
                            ></path>

                            <path
                                d="M14 18h2"
                            ></path>
                        </svg>

                        <span>월별 통계</span>
                    </a>

                    <a
                        class="menu-link"
                        data-route="firestore-usage"
                        href="#/firestore-usage"
                        hidden
                    >
                        <svg
                            class="menu-icon"
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <ellipse
                                cx="12"
                                cy="5"
                                rx="9"
                                ry="3"
                            ></ellipse>

                            <path
                                d="M3 5v7c0 1.66 4.03 3 9 3s9-1.34 9-3V5"
                            ></path>

                            <path
                                d="M3 12v7c0 1.66 4.03 3 9 3s9-1.34 9-3v-7"
                            ></path>
                        </svg>

                        <span>Firestore 사용량</span>
                    </a>
                </nav>
            </aside>

            <main class="main-area">
                <header class="topbar">
                    <div>
                        <h1
                            id="pageTitle"
                            class="page-title"
                        >
                            Dashboard
                        </h1>
                    </div>

                    <div class="topbar-right">
                        <div
                            id="pageActions"
                            class="page-actions"
                        ></div>

                        <div class="session-chip">
                            <span
                                id="sessionRole"
                                class="session-role"
                            >
                                일반
                            </span>

                            <span
                                id="sessionEmail"
                                class="session-email"
                            >
                                -
                            </span>

                            <button
                                id="logoutButton"
                                class="session-logout"
                                type="button"
                            >
                                로그아웃
                            </button>
                        </div>
                    </div>
                </header>

                <div
                    id="pageContent"
                    class="page-content"
                ></div>
            </main>
        </div>
    </section>

    <script
        type="module"
        src="./js/app.js"
    ></script>
</body>
</html>

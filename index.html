<!-- /index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>교재팀 대시보드</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --nav: #052b63;
            --nav2: #073b7c;
            --blue: #0d6efd;
            --blue2: #1767d9;
            --red: #ef3340;
            --ink: #12213d;
            --muted: #76839a;
            --bg: #f3f6fa;
            --card: #ffffff;
            --line: #dfe6ef;
            --soft: #f7f9fc;
            --shadow: 0 6px 18px rgba(30, 55, 90, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        button,
        input,
        select,
        canvas {
            font-family:
                "Noto Sans KR",
                "Malgun Gothic",
                "Apple SD Gothic Neo",
                Arial,
                sans-serif;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            color: var(--ink);
            background: var(--bg);
            font-size: 13px;
            letter-spacing: -0.15px;
        }

        [hidden] {
            display: none !important;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .auth-gate {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                linear-gradient(
                    135deg,
                    #edf3fb 0%,
                    #f7f9fc 48%,
                    #e9f1fb 100%
                );
        }

        .auth-card {
            width: min(420px, 100%);
            padding: 28px 28px 24px;
            border: 1px solid #dce5f0;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 22px 60px rgba(16, 42, 78, 0.18);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 14px;
            color: #37506f;
            font-size: 12px;
            font-weight: 900;
        }

        .auth-logo-mark {
            display: grid;
            width: 30px;
            height: 30px;
            place-items: center;
            overflow: hidden;
            border-radius: 9px;
            background: #0c5ecf;
        }

        .auth-logo-mark img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .auth-title {
            margin: 0 0 7px;
            color: #10233f;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.7px;
        }

        .auth-desc {
            margin-bottom: 18px;
            color: #6e7f95;
            font-size: 12px;
            line-height: 1.6;
        }

        .auth-fields {
            display: grid;
            gap: 10px;
        }

        .auth-fields input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #d5deea;
            border-radius: 9px;
            outline: 0;
            color: #17263e;
            background: #ffffff;
            font-weight: 700;
        }

        .auth-fields input:focus {
            border-color: #4a8df0;
            box-shadow: 0 0 0 3px rgba(30, 111, 232, 0.1);
        }

        .auth-login-btn {
            height: 44px;
            margin-top: 2px;
            border-radius: 9px;
            color: #ffffff;
            background: #0f6fe8;
            font-weight: 900;
        }

        .auth-status {
            min-height: 18px;
            margin-top: 10px;
            color: #748399;
            font-size: 11px;
            line-height: 1.5;
        }

        .auth-status.error {
            color: #c83232;
        }

        .auth-note {
            margin-top: 16px;
            padding-top: 13px;
            border-top: 1px solid #edf1f5;
            color: #8793a4;
            font-size: 10.5px;
            line-height: 1.55;
        }

        .loading-view {
            position: fixed;
            inset: 0;
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #65758b;
            background: var(--bg);
            font-size: 13px;
            font-weight: 800;
        }

        .app {
            display: grid;
            grid-template-columns: 182px minmax(0, 1fr);
            min-height: 100vh;
        }

        .side {
            position: sticky;
            top: 0;
            z-index: 5;
            height: 100vh;
            padding: 14px 10px;
            color: #ffffff;
            background:
                linear-gradient(
                    180deg,
                    #03265a 0%,
                    #073b7c 55%,
                    #062d65 100%
                );
            box-shadow: 4px 0 16px rgba(3, 32, 71, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 56px;
            padding: 0 10px 10px;
            white-space: nowrap;
        }

        .brand-menu-symbol {
            font-size: 15px;
        }

        .brand small {
            font-size: 12px;
            font-weight: 800;
        }

        .brand-m-symbol {
            width: 25px;
            height: 25px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .menu button {
            width: 100%;
            padding: 13px 14px;
            border-radius: 9px;
            color: #ffffff;
            background: transparent;
            text-align: left;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: -0.35px;
        }

        .menu button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .menu button.active {
            background: #1673f8;
        }

        .main {
            min-width: 0;
            padding: 0 14px 20px;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 68px;
            margin: 0 -14px 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--line);
            background: #ffffff;
        }

        .title {
            flex: 0 0 auto;
            color: var(--ink);
            font-size: 23px;
            font-weight: 900;
            letter-spacing: -0.8px;
            white-space: nowrap;
        }

        .top-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            min-width: 0;
        }

        .filters {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .datebox {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 310px;
            padding: 8px 12px;
            border: 1px solid #d7e0eb;
            border-radius: 9px;
            background: #ffffff;
        }

        .datebox input {
            min-width: 120px;
            padding: 0;
            border: 0;
            outline: 0;
            color: var(--ink);
            background: transparent;
            font-weight: 800;
        }

        .btn {
            height: 40px;
            padding: 0 15px;
            border-radius: 8px;
            font-weight: 800;
        }

        .primary {
            color: #ffffff;
            background: #0f6fe8;
        }

        .primary:hover {
            background: #0b62cf;
        }

        .monthbox {
            display: flex;
            align-items: center;
            gap: 7px;
            height: 40px;
            padding: 0 10px;
            border: 1px solid #d7e0eb;
            border-radius: 9px;
            background: #ffffff;
        }

        .monthbox-label {
            color: #617187;
            font-size: 10.5px;
            font-weight: 900;
            white-space: nowrap;
        }

        .monthbox select {
            min-width: 112px;
            border: 0;
            outline: 0;
            color: #173c6e;
            background: transparent;
            font-size: 11px;
            font-weight: 800;
        }

        .session-chip {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 6px 5px 9px;
            border: 1px solid #dfe6ef;
            border-radius: 9px;
            background: #f8fafc;
            white-space: nowrap;
        }

        .session-role {
            padding: 4px 6px;
            border-radius: 6px;
            color: #0c5ecf;
            background: #e8f1ff;
            font-size: 10px;
            font-weight: 900;
        }

        .session-email {
            max-width: 170px;
            overflow: hidden;
            color: #65758b;
            font-size: 10.5px;
            font-weight: 700;
            text-overflow: ellipsis;
        }

        .session-logout {
            height: 28px;
            padding: 0 8px;
            border-radius: 6px;
            color: #4d5c70;
            background: #eef2f7;
            font-size: 10.5px;
            font-weight: 800;
        }

        .session-logout:hover {
            color: #1f3d63;
            background: #e2e8f0;
        }

        .period-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-height: 26px;
            margin-bottom: 8px;
        }

        .period-status {
            margin: 0;
            color: #65778f;
            font-size: 10.5px;
            font-weight: 700;
        }

        .period-status.error {
            color: #c83232;
        }

        .detail-chart-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            width: 100%;
        }

        .detail-chart-card {
            width: 100%;
            min-width: 0;
            padding: 12px 14px 10px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #ffffff;
            box-shadow: var(--shadow);
        }

        .detail-chart-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .detail-chart-title {
            margin-bottom: 4px;
            color: #14243f;
            font-size: 13px;
            font-weight: 900;
        }

        .detail-chart-sub {
            margin-bottom: 8px;
            color: #7a8798;
            font-size: 10px;
        }

        .chart-legend {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #6d7d91;
            font-size: 9.5px;
            font-weight: 800;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .legend-line {
            width: 20px;
            height: 3px;
            border-radius: 999px;
        }

        .legend-current {
            background: #1d4ed8;
        }

        .legend-previous {
            background: #9ca3af;
        }

        .detail-chart-box {
            position: relative;
            width: 100%;
            height: 210px;
            min-height: 210px;
            max-height: 210px;
        }

        .detail-chart-box canvas {
            width: 100% !important;
            height: 210px !important;
            max-height: 210px !important;
        }

        .chart-tooltip {
            position: absolute;
            z-index: 20;
            min-width: 220px;
            padding: 12px;
            border: 1px solid #dfe6ef;
            border-radius: 9px;
            color: #1f2937;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, calc(-100% - 10px));
            transition: opacity 0.1s ease;
        }

        .tooltip-title {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
            color: #14243f;
            font-size: 11px;
            font-weight: 900;
        }

        .tooltip-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-top: 6px;
            font-size: 11px;
        }

        .tooltip-label {
            color: #748399;
        }

        .tooltip-value {
            font-weight: 900;
            white-space: nowrap;
        }

        .tooltip-current {
            color: #1d4ed8;
        }

        .tooltip-previous {
            color: #6b7280;
        }

        .tooltip-positive {
            color: var(--red);
        }

        .tooltip-negative {
            color: #1267de;
        }

        .tooltip-neutral {
            color: #76839a;
        }

        @media (max-width: 1250px) {
            .top {
                align-items: flex-start;
                flex-direction: column;
            }

            .top-right {
                width: 100%;
                justify-content: space-between;
            }

            .filters {
                justify-content: flex-start;
            }
        }

        @media (max-width: 900px) {
            .session-email {
                display: none;
            }

            .datebox {
                min-width: 0;
            }
        }

        @media (max-width: 700px) {
            .app {
                grid-template-columns: 1fr;
            }

            .side {
                position: relative;
                height: auto;
            }

            .brand {
                height: 48px;
            }

            .menu {
                flex-direction: row;
            }

            .menu button {
                width: auto;
            }

            .top-right,
            .filters {
                align-items: stretch;
                flex-direction: column;
                width: 100%;
            }

            .datebox,
            .monthbox,
            .session-chip {
                width: 100%;
            }

            .datebox {
                justify-content: space-between;
            }

            .monthbox select {
                flex: 1;
            }

            .session-chip {
                justify-content: flex-end;
            }
        }
    </style>
</head>

<body>
    <section id="loadingView" class="loading-view">
        로그인 상태를 확인하고 있습니다.
    </section>

    <section id="loginView" class="auth-gate" hidden>
        <div class="auth-card">
            <div class="auth-logo">
                <span class="auth-logo-mark">
                    <img
                        src="https://img.megastudy.net/common/mega_57.png"
                        alt="Megastudy"
                    >
                </span>

                <span>megastudy · 교재팀</span>
            </div>

            <h1 class="auth-title">
                교재팀 대시보드 로그인
            </h1>

            <div class="auth-desc">
                승인된 계정만 대시보드에 접근할 수 있습니다.
            </div>

            <form id="loginForm" class="auth-fields">
                <input
                    id="email"
                    type="email"
                    placeholder="이메일"
                    autocomplete="username"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="비밀번호"
                    autocomplete="current-password"
                    required
                >

                <button
                    id="loginButton"
                    class="auth-login-btn"
                    type="submit"
                >
                    로그인
                </button>
            </form>

            <div id="loginMessage" class="auth-status">
                Firebase Authentication 계정으로 로그인해 주세요.
            </div>

            <div class="auth-note">
                등록된 계정으로 로그인한 사용자만 출고현황을
                조회할 수 있습니다.
            </div>
        </div>
    </section>

    <section id="dashboardView" hidden>
        <div class="app">
            <aside class="side">
                <div class="brand">
                    <span class="brand-menu-symbol">☰</span>

                    <small>megastudy</small>

                    <img
                        class="brand-m-symbol"
                        src="https://img.megastudy.net/common/mega_57.png"
                        alt="M"
                    >
                </div>

                <nav class="menu">
                    <button
                        class="active"
                        type="button"
                    >
                        ⌂　<span>통합현황</span>
                    </button>
                </nav>
            </aside>

            <main class="main">
                <header class="top">
                    <div class="title">
                        교재팀 대시보드
                    </div>

                    <div class="top-right">
                        <div class="filters">
                            <div class="datebox">
                                <span>📅</span>

                                <input
                                    id="startDate"
                                    type="date"
                                    aria-label="시작일"
                                >

                                <span>~</span>

                                <input
                                    id="endDate"
                                    type="date"
                                    aria-label="종료일"
                                >
                            </div>

                            <button
                                id="searchButton"
                                class="btn primary"
                                type="button"
                            >
                                조회
                            </button>

                            <div class="monthbox">
                                <span class="monthbox-label">
                                    월별조회
                                </span>

                                <select
                                    id="monthSelect"
                                    aria-label="월별조회"
                                >
                                    <option value="">
                                        월 선택
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="session-chip">
                            <span class="session-role">
                                일반
                            </span>

                            <span
                                id="sessionEmail"
                                class="session-email"
                            >
                                -
                            </span>

                            <button
                                id="logoutButton"
                                class="session-logout"
                                type="button"
                            >
                                로그아웃
                            </button>
                        </div>
                    </div>
                </header>

                <section class="period-row">
                    <p
                        id="periodStatus"
                        class="period-status"
                    >
                        출고자료를 불러오고 있습니다.
                    </p>
                </section>

                <section class="detail-chart-grid">
                    <article class="detail-chart-card">
                        <div class="detail-chart-head">
                            <div>
                                <div class="detail-chart-title">
                                    전체 출고 건수
                                </div>

                                <div class="detail-chart-sub">
                                    금년 vs 전년 동기간
                                </div>
                            </div>

                            <div class="chart-legend">
                                <span class="legend-item">
                                    <span
                                        class="legend-line legend-current"
                                    ></span>
                                    금년
                                </span>

                                <span class="legend-item">
                                    <span
                                        class="legend-line legend-previous"
                                    ></span>
                                    전년 동기간
                                </span>
                            </div>
                        </div>

                        <div class="detail-chart-box">
                            <canvas id="ordersChart"></canvas>
                        </div>
                    </article>

                    <article class="detail-chart-card">
                        <div class="detail-chart-head">
                            <div>
                                <div class="detail-chart-title">
                                    전체 출고 권수
                                </div>

                                <div class="detail-chart-sub">
                                    금년 vs 전년 동기간
                                </div>
                            </div>

                            <div class="chart-legend">
                                <span class="legend-item">
                                    <span
                                        class="legend-line legend-current"
                                    ></span>
                                    금년
                                </span>

                                <span class="legend-item">
                                    <span
                                        class="legend-line legend-previous"
                                    ></span>
                                    전년 동기간
                                </span>
                            </div>
                        </div>

                        <div class="detail-chart-box">
                            <canvas id="booksChart"></canvas>
                        </div>
                    </article>
                </section>
            </main>
        </div>
    </section>

    <script type="module">
        import {
            firebaseConfig
        } from "./firebase-config.js";

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        import {
            getFirestore,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const numberFormatter =
            new Intl.NumberFormat("ko-KR");

        const loadingView =
            document.getElementById("loadingView");

        const loginView =
            document.getElementById("loginView");

        const dashboardView =
            document.getElementById("dashboardView");

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const loginMessage =
            document.getElementById("loginMessage");

        const logoutButton =
            document.getElementById("logoutButton");

        const sessionEmail =
            document.getElementById("sessionEmail");

        const startDateInput =
            document.getElementById("startDate");

        const endDateInput =
            document.getElementById("endDate");

        const searchButton =
            document.getElementById("searchButton");

        const monthSelect =
            document.getElementById("monthSelect");

        const periodStatus =
            document.getElementById("periodStatus");

        const ordersCanvas =
            document.getElementById("ordersChart");

        const booksCanvas =
            document.getElementById("booksChart");

        const shippingDataMap = new Map();

        let ordersChart = null;
        let booksChart = null;

        function showView(view) {
            loadingView.hidden =
                view !== "loading";

            loginView.hidden =
                view !== "login";

            dashboardView.hidden =
                view !== "dashboard";
        }

        function getNumber(value) {
            const convertedValue = Number(value);

            if (!Number.isFinite(convertedValue)) {
                return 0;
            }

            return convertedValue;
        }

        function formatNumber(value) {
            return numberFormatter.format(
                getNumber(value)
            );
        }

        function padNumber(value) {
            return String(value).padStart(2, "0");
        }

        function dateToId(date) {
            return (
                date.getFullYear() +
                "-" +
                padNumber(date.getMonth() + 1) +
                "-" +
                padNumber(date.getDate())
            );
        }

        function parseDateId(dateId) {
            const parts =
                String(dateId).split("-");

            if (parts.length !== 3) {
                return null;
            }

            const year = Number(parts[0]);
            const month = Number(parts[1]);
            const day = Number(parts[2]);

            const date = new Date(
                year,
                month - 1,
                day
            );

            if (
                date.getFullYear() !== year ||
                date.getMonth() + 1 !== month ||
                date.getDate() !== day
            ) {
                return null;
            }

            return date;
        }

        function addDays(date, numberOfDays) {
            const result = new Date(
                date.getFullYear(),
                date.getMonth(),
                date.getDate()
            );

            result.setDate(
                result.getDate() + numberOfDays
            );

            return result;
        }

        function isLeapYear(year) {
            return (
                year % 400 === 0 ||
                (
                    year % 4 === 0 &&
                    year % 100 !== 0
                )
            );
        }

        function getPreviousYearDateId(dateId) {
            const parts =
                String(dateId).split("-");

            if (parts.length !== 3) {
                return "";
            }

            const currentYear =
                Number(parts[0]);

            const month =
                Number(parts[1]);

            const day =
                Number(parts[2]);

            const previousYear =
                currentYear - 1;

            if (
                month === 2 &&
                day === 29 &&
                !isLeapYear(previousYear)
            ) {
                return previousYear + "-02-28";
            }

            return (
                previousYear +
                "-" +
                padNumber(month) +
                "-" +
                padNumber(day)
            );
        }

        function formatFullDate(dateId) {
            const date =
                parseDateId(dateId);

            if (!date) {
                return dateId;
            }

            return (
                date.getFullYear() +
                "." +
                (date.getMonth() + 1) +
                "." +
                date.getDate()
            );
        }

        function formatChartDate(dateId) {
            const date =
                parseDateId(dateId);

            if (!date) {
                return dateId;
            }

            return (
                (date.getMonth() + 1) +
                "." +
                date.getDate()
            );
        }

        function getDateRange(
            startDateId,
            endDateId
        ) {
            const startDate =
                parseDateId(startDateId);

            const endDate =
                parseDateId(endDateId);

            if (!startDate || !endDate) {
                return [];
            }

            const dateIds = [];
            let currentDate =
                new Date(startDate);

            while (currentDate <= endDate) {
                dateIds.push(
                    dateToId(currentDate)
                );

                currentDate =
                    addDays(currentDate, 1);
            }

            return dateIds;
        }

        function calculateShippingData(rawData) {
            const lectureOrders =
                getNumber(rawData.lecture_orders);

            const lectureBooks =
                getNumber(rawData.lecture_books);

            const resendOrders =
                getNumber(rawData.resend_orders);

            const resendBooks =
                getNumber(rawData.resend_books);

            const unistudyOrders =
                getNumber(rawData.unistudy_orders);

            const unistudyBooks =
                getNumber(rawData.unistudy_books);

            const bookstoreOrders =
                getNumber(rawData.bookstore_orders);

            const bookstoreBooks =
                getNumber(rawData.bookstore_books);

            return {
                totalOrders:
                    lectureOrders +
                    resendOrders +
                    unistudyOrders +
                    bookstoreOrders,

                totalBooks:
                    lectureBooks +
                    resendBooks +
                    unistudyBooks +
                    bookstoreBooks
            };
        }

        function getShippingValue(
            dateId,
            fieldName
        ) {
            const row =
                shippingDataMap.get(dateId);

            if (!row) {
                return 0;
            }

            return getNumber(row[fieldName]);
        }

        function getComparisonClass(value) {
            if (value > 0) {
                return "tooltip-positive";
            }

            if (value < 0) {
                return "tooltip-negative";
            }

            return "tooltip-neutral";
        }

        function formatSignedValue(
            value,
            unit
        ) {
            const numberValue =
                getNumber(value);

            const sign =
                numberValue > 0 ? "+" : "";

            return (
                sign +
                formatNumber(numberValue) +
                unit
            );
        }

        function calculateChangeRate(
            currentValue,
            previousValue
        ) {
            if (previousValue === 0) {
                if (currentValue === 0) {
                    return {
                        text: "0.0%",
                        className: "tooltip-neutral"
                    };
                }

                return {
                    text: "산정 불가",
                    className: "tooltip-neutral"
                };
            }

            const rate =
                (
                    (
                        currentValue -
                        previousValue
                    ) /
                    previousValue
                ) *
                100;

            const sign =
                rate > 0 ? "+" : "";

            return {
                text:
                    sign +
                    rate.toFixed(1) +
                    "%",

                className:
                    getComparisonClass(rate)
            };
        }

        function getOrCreateTooltip(chart) {
            const container =
                chart.canvas.parentNode;

            let tooltipElement =
                container.querySelector(
                    ".chart-tooltip"
                );

            if (!tooltipElement) {
                tooltipElement =
                    document.createElement("div");

                tooltipElement.className =
                    "chart-tooltip";

                container.appendChild(
                    tooltipElement
                );
            }

            return tooltipElement;
        }

        function renderExternalTooltip(
            context,
            unit
        ) {
            const chart = context.chart;
            const tooltip = context.tooltip;

            const tooltipElement =
                getOrCreateTooltip(chart);

            if (
                tooltip.opacity === 0 ||
                !tooltip.dataPoints ||
                tooltip.dataPoints.length === 0
            ) {
                tooltipElement.style.opacity = 0;
                return;
            }

            const dataIndex =
                tooltip.dataPoints[0].dataIndex;

            const comparison =
                chart.comparisonRows[dataIndex];

            if (!comparison) {
                tooltipElement.style.opacity = 0;
                return;
            }

            const currentValue =
                comparison.currentValue;

            const previousValue =
                comparison.previousValue;

            const changeValue =
                currentValue - previousValue;

            const changeClass =
                getComparisonClass(changeValue);

            const rate =
                calculateChangeRate(
                    currentValue,
                    previousValue
                );

            tooltipElement.innerHTML =
                '<div class="tooltip-title">' +
                    formatFullDate(
                        comparison.currentDate
                    ) +
                    " / 전년 " +
                    formatFullDate(
                        comparison.previousDate
                    ) +
                "</div>" +

                '<div class="tooltip-row">' +
                    '<span class="tooltip-label">금년</span>' +
                    '<span class="tooltip-value tooltip-current">' +
                        formatNumber(currentValue) +
                        unit +
                    "</span>" +
                "</div>" +

                '<div class="tooltip-row">' +
                    '<span class="tooltip-label">전년</span>' +
                    '<span class="tooltip-value tooltip-previous">' +
                        formatNumber(previousValue) +
                        unit +
                    "</span>" +
                "</div>" +

                '<div class="tooltip-row">' +
                    '<span class="tooltip-label">증감</span>' +
                    '<span class="tooltip-value ' +
                        changeClass +
                    '">' +
                        formatSignedValue(
                            changeValue,
                            unit
                        ) +
                    "</span>" +
                "</div>" +

                '<div class="tooltip-row">' +
                    '<span class="tooltip-label">증감률</span>' +
                    '<span class="tooltip-value ' +
                        rate.className +
                    '">' +
                        rate.text +
                    "</span>" +
                "</div>";

            const canvasPosition =
                chart.canvas.getBoundingClientRect();

            const containerPosition =
                chart.canvas
                    .parentNode
                    .getBoundingClientRect();

            let left =
                canvasPosition.left -
                containerPosition.left +
                tooltip.caretX;

            const top =
                canvasPosition.top -
                containerPosition.top +
                tooltip.caretY;

            const tooltipWidth =
                tooltipElement.offsetWidth || 220;

            const minimumLeft =
                tooltipWidth / 2 + 8;

            const maximumLeft =
                containerPosition.width -
                tooltipWidth / 2 -
                8;

            left = Math.max(
                minimumLeft,
                Math.min(left, maximumLeft)
            );

            tooltipElement.style.opacity = 1;
            tooltipElement.style.left =
                left + "px";

            tooltipElement.style.top =
                top + "px";
        }

        function createChart(
            canvas,
            currentValues,
            previousValues,
            comparisonRows,
            unit
        ) {
            const labels =
                comparisonRows.map(function (row) {
                    return formatChartDate(
                        row.currentDate
                    );
                });

            const chart = new Chart(
                canvas,
                {
                    type: "line",

                    data: {
                        labels: labels,

                        datasets: [
                            {
                                label: "금년",
                                data: currentValues,
                                borderColor: "#1d4ed8",
                                backgroundColor: "#1d4ed8",
                                borderWidth: 2.5,
                                pointRadius: 1.5,
                                pointHoverRadius: 5,
                                pointBorderWidth: 0,
                                tension: 0.25,
                                fill: false
                            },
                            {
                                label: "전년 동기간",
                                data: previousValues,
                                borderColor: "#9ca3af",
                                backgroundColor: "#9ca3af",
                                borderWidth: 2,
                                pointRadius: 1.5,
                                pointHoverRadius: 5,
                                pointBorderWidth: 0,
                                tension: 0.25,
                                fill: false
                            }
                        ]
                    },

                    options: {
                        responsive: true,
                        maintainAspectRatio: false,

                        interaction: {
                            mode: "index",
                            intersect: true
                        },

                        layout: {
                            padding: {
                                top: 5,
                                right: 8,
                                bottom: 0,
                                left: 2
                            }
                        },

                        plugins: {
                            legend: {
                                display: false
                            },

                            tooltip: {
                                enabled: false,

                                external: function (context) {
                                    renderExternalTooltip(
                                        context,
                                        unit
                                    );
                                }
                            }
                        },

                        scales: {
                            x: {
                                grid: {
                                    display: false
                                },

                                ticks: {
                                    color: "#76839a",
                                    font: {
                                        size: 9
                                    },
                                    maxRotation: 0,
                                    autoSkip: true,
                                    maxTicksLimit: 18
                                }
                            },

                            y: {
                                beginAtZero: true,

                                grid: {
                                    color: "#edf1f5"
                                },

                                ticks: {
                                    color: "#76839a",
                                    font: {
                                        size: 9
                                    },

                                    callback: function (value) {
                                        return formatNumber(value);
                                    }
                                }
                            }
                        }
                    }
                }
            );

            chart.comparisonRows =
                comparisonRows;

            return chart;
        }

        function renderCharts(
            startDateId,
            endDateId
        ) {
            const currentDateIds =
                getDateRange(
                    startDateId,
                    endDateId
                );

            const comparisonRows =
                currentDateIds.map(
                    function (currentDateId) {
                        const previousDateId =
                            getPreviousYearDateId(
                                currentDateId
                            );

                        return {
                            currentDate:
                                currentDateId,

                            previousDate:
                                previousDateId,

                            currentOrders:
                                getShippingValue(
                                    currentDateId,
                                    "totalOrders"
                                ),

                            previousOrders:
                                getShippingValue(
                                    previousDateId,
                                    "totalOrders"
                                ),

                            currentBooks:
                                getShippingValue(
                                    currentDateId,
                                    "totalBooks"
                                ),

                            previousBooks:
                                getShippingValue(
                                    previousDateId,
                                    "totalBooks"
                                )
                        };
                    }
                );

            if (ordersChart) {
                ordersChart.destroy();
            }

            if (booksChart) {
                booksChart.destroy();
            }

            const orderRows =
                comparisonRows.map(function (row) {
                    return {
                        currentDate: row.currentDate,
                        previousDate: row.previousDate,
                        currentValue: row.currentOrders,
                        previousValue: row.previousOrders
                    };
                });

            const bookRows =
                comparisonRows.map(function (row) {
                    return {
                        currentDate: row.currentDate,
                        previousDate: row.previousDate,
                        currentValue: row.currentBooks,
                        previousValue: row.previousBooks
                    };
                });

            ordersChart = createChart(
                ordersCanvas,
                orderRows.map(function (row) {
                    return row.currentValue;
                }),
                orderRows.map(function (row) {
                    return row.previousValue;
                }),
                orderRows,
                "건"
            );

            booksChart = createChart(
                booksCanvas,
                bookRows.map(function (row) {
                    return row.currentValue;
                }),
                bookRows.map(function (row) {
                    return row.previousValue;
                }),
                bookRows,
                "권"
            );

            periodStatus.classList.remove("error");

            periodStatus.textContent =
                formatFullDate(startDateId) +
                " ~ " +
                formatFullDate(endDateId) +
                " · 전년 동기간 비교";
        }

        function populateMonthSelect() {
            const monthSet = new Set();

            shippingDataMap.forEach(
                function (value, dateId) {
                    if (
                        typeof dateId === "string" &&
                        dateId.length >= 7
                    ) {
                        monthSet.add(
                            dateId.substring(0, 7)
                        );
                    }
                }
            );

            const currentMonth =
                dateToId(
                    new Date()
                ).substring(0, 7);

            monthSet.add(currentMonth);

            const sortedMonths =
                Array.from(monthSet).sort(
                    function (first, second) {
                        return second.localeCompare(first);
                    }
                );

            monthSelect.innerHTML =
                '<option value="">월 선택</option>';

            sortedMonths.forEach(
                function (monthId) {
                    const parts =
                        monthId.split("-");

                    const option =
                        document.createElement("option");

                    option.value = monthId;

                    option.textContent =
                        parts[0] +
                        "년 " +
                        Number(parts[1]) +
                        "월";

                    monthSelect.appendChild(option);
                }
            );
        }

        function applyDefaultPeriod() {
            const today = new Date();

            const startDate =
                addDays(today, -90);

            const startDateId =
                dateToId(startDate);

            const endDateId =
                dateToId(today);

            startDateInput.value =
                startDateId;

            endDateInput.value =
                endDateId;

            monthSelect.value = "";

            renderCharts(
                startDateId,
                endDateId
            );
        }

        function searchByManualPeriod() {
            const startDateId =
                startDateInput.value;

            const endDateId =
                endDateInput.value;

            const startDate =
                parseDateId(startDateId);

            const endDate =
                parseDateId(endDateId);

            if (!startDate || !endDate) {
                periodStatus.classList.add("error");

                periodStatus.textContent =
                    "시작일과 종료일을 모두 입력해 주십시오.";

                return;
            }

            if (startDate > endDate) {
                periodStatus.classList.add("error");

                periodStatus.textContent =
                    "시작일은 종료일보다 늦을 수 없습니다.";

                return;
            }

            monthSelect.value = "";

            renderCharts(
                startDateId,
                endDateId
            );
        }

        function searchByMonth(monthId) {
            if (!monthId) {
                return;
            }

            const parts =
                monthId.split("-");

            const year =
                Number(parts[0]);

            const month =
                Number(parts[1]);

            const lastDay =
                new Date(
                    year,
                    month,
                    0
                ).getDate();

            const startDateId =
                year +
                "-" +
                padNumber(month) +
                "-01";

            const endDateId =
                year +
                "-" +
                padNumber(month) +
                "-" +
                padNumber(lastDay);

            startDateInput.value =
                startDateId;

            endDateInput.value =
                endDateId;

            renderCharts(
                startDateId,
                endDateId
            );
        }

        async function loadShippingData() {
            periodStatus.classList.remove("error");

            periodStatus.textContent =
                "출고자료를 불러오고 있습니다.";

            try {
                if (typeof Chart === "undefined") {
                    throw new Error(
                        "Chart.js를 불러오지 못했습니다."
                    );
                }

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "shippingDaily"
                        )
                    );

                shippingDataMap.clear();

                snapshot.docs.forEach(
                    function (documentSnapshot) {
                        const rawData =
                            documentSnapshot.data();

                        const shippingDate =
                            String(
                                rawData.shipping_date ||
                                documentSnapshot.id
                            );

                        if (!parseDateId(shippingDate)) {
                            return;
                        }

                        shippingDataMap.set(
                            shippingDate,
                            calculateShippingData(
                                rawData
                            )
                        );
                    }
                );

                populateMonthSelect();
                applyDefaultPeriod();
            } catch (error) {
                console.error(
                    "[loadShippingData]",
                    error
                );

                periodStatus.classList.add("error");

                periodStatus.textContent =
                    "출고자료를 불러오지 못했습니다. " +
                    "Firestore 설정과 보안 규칙을 확인해 주십시오.";
            }
        }

        searchButton.addEventListener(
            "click",
            searchByManualPeriod
        );

        monthSelect.addEventListener(
            "change",
            function () {
                searchByMonth(
                    monthSelect.value
                );
            }
        );

        loginForm.addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;

                loginMessage.classList.remove("error");
                loginMessage.textContent =
                    "로그인 중입니다.";

                loginButton.disabled = true;
                loginButton.textContent =
                    "로그인 중...";

                try {
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                    loginForm.reset();
                } catch (error) {
                    console.error(
                        "[login]",
                        error
                    );

                    loginMessage.classList.add("error");

                    loginMessage.textContent =
                        "이메일 또는 비밀번호를 확인해 주십시오.";
                } finally {
                    loginButton.disabled = false;
                    loginButton.textContent =
                        "로그인";
                }
            }
        );

        logoutButton.addEventListener(
            "click",
            async function () {
                try {
                    await signOut(auth);
                } catch (error) {
                    console.error(
                        "[logout]",
                        error
                    );
                }
            }
        );

        onAuthStateChanged(
            auth,
            async function (user) {
                if (!user) {
                    sessionEmail.textContent = "-";
                    showView("login");
                    return;
                }

                sessionEmail.textContent =
                    user.email || "-";

                showView("dashboard");

                await loadShippingData();
            }
        );
    </script>
</body>
</html>

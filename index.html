<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출고현황 대시보드</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans KR", sans-serif;
            color: #1f2937;
            background: #f3f6fb;
        }

        [hidden] {
            display: none !important;
        }

        .center-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
        }

        .logo {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            border-radius: 14px;
            color: #ffffff;
            background: #2563eb;
            font-size: 25px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .description {
            margin: 0 0 28px;
            color: #64748b;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 48px;
            margin-bottom: 18px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-button {
            color: #ffffff;
            background: #2563eb;
        }

        .primary-button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            min-height: 22px;
            margin: 16px 0 0;
            color: #dc2626;
            font-size: 14px;
            text-align: center;
        }

        .loading {
            color: #475569;
            font-size: 18px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 32px;
            color: #ffffff;
            background: #0f172a;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
        }

        .logout-button {
            width: auto;
            height: 40px;
            padding: 0 18px;
            color: #ffffff;
            background: #334155;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .welcome-card {
            padding: 28px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        .role-badge {
            display: inline-block;
            margin-top: 14px;
            padding: 7px 12px;
            border-radius: 999px;
            color: #1d4ed8;
            background: #dbeafe;
            font-size: 14px;
            font-weight: 700;
        }

        .next-message {
            margin-top: 24px;
            padding: 20px;
            color: #475569;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .login-card {
                padding: 28px 22px;
            }

            header {
                padding: 16px 20px;
            }
        }
    </style>
</head>

<body>
    <section id="loadingView" class="center-screen">
        <p class="loading">로그인 상태를 확인하고 있습니다.</p>
    </section>

    <section id="loginView" class="center-screen" hidden>
        <div class="login-card">
            <div class="logo">출</div>

            <h1>출고현황 대시보드</h1>
            <p class="description">
                등록된 계정으로 로그인해 주십시오.
            </p>

            <form id="loginForm">
                <label for="email">이메일</label>
                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    required
                >

                <label for="password">비밀번호</label>
                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button
                    id="loginButton"
                    class="primary-button"
                    type="submit"
                >
                    로그인
                </button>

                <p id="loginMessage" class="message"></p>
            </form>
        </div>
    </section>

    <section id="dashboardView" hidden>
        <header>
            <div class="header-title">출고현황 대시보드</div>
            <button id="logoutButton" class="logout-button">
                로그아웃
            </button>
        </header>

        <main>
            <div class="welcome-card">
                <h1 id="welcomeTitle">로그인되었습니다.</h1>
                <p id="userEmail"></p>
                <span id="userRole" class="role-badge"></span>

                <div class="next-message">
                    Firebase 로그인과 사용자 권한 연결이 정상적으로 완료되었습니다.
                    다음 단계에서 출고현황 입력 및 조회 기능을 추가합니다.
                </div>
            </div>
        </main>
    </section>

    <script type="module">
        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDz3dud_kVAA__WtNJAbPf7FVhhUFzDFKI",
            authDomain: "dashboard-b9f24.firebaseapp.com",
            projectId: "dashboard-b9f24",
            storageBucket: "dashboard-b9f24.firebasestorage.app",
            messagingSenderId: "664038459364",
            appId: "1:664038459364:web:764352895560f0a17029f1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loadingView = document.getElementById("loadingView");
        const loginView = document.getElementById("loginView");
        const dashboardView = document.getElementById("dashboardView");

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const loginMessage = document.getElementById("loginMessage");
        const logoutButton = document.getElementById("logoutButton");

        function showView(view) {
            loadingView.hidden = view !== "loading";
            loginView.hidden = view !== "login";
            dashboardView.hidden = view !== "dashboard";
        }

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginMessage.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "로그인 중...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginForm.reset();
            } catch (error) {
                console.error(error);
                loginMessage.textContent =
                    "이메일 또는 비밀번호를 확인해 주십시오.";
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "로그인";
            }
        });

        logoutButton.addEventListener("click", async () => {
            await signOut(auth);
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                showView("login");
                return;
            }

            showView("loading");

            try {
                const userReference = doc(db, "users", user.uid);
                const userSnapshot = await getDoc(userReference);

                if (!userSnapshot.exists()) {
                    throw new Error("사용자 권한 문서가 없습니다.");
                }

                const profile = userSnapshot.data();
                const roleName =
                    profile.role === "admin" ? "관리자" : "뷰어";

                document.getElementById("welcomeTitle").textContent =
                    `${profile.name || roleName} 계정으로 로그인되었습니다.`;

                document.getElementById("userEmail").textContent =
                    user.email;

                document.getElementById("userRole").textContent =
                    `권한: ${roleName}`;

                showView("dashboard");
            } catch (error) {
                console.error(error);
                await signOut(auth);
                showView("login");
                loginMessage.textContent =
                    "사용자 권한 정보를 확인할 수 없습니다.";
            }
        });
    </script>
</body>
</html>
